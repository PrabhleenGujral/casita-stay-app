[build]
  command = "pnpm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "pnpm run dev"
  port = 5173

[context.production]
  command = "pnpm run build"
  publish = "dist"

[context.deploy-preview]
  command = "pnpm run build"
  publish = "dist"

[context.branch-deploy]
  command = "pnpm run build"
  publish = "dist"
